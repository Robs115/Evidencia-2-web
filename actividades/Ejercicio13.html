<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocultar y Mostrar Imagen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <br>
    <div class="row">
        <div class="col-6">

        </div>

        <div class="col-6">
                <a href="../index.html" class="btn btn-dark">Regresar a la Pagina Principal</a>
        </div>
    </div>
    <button onclick="Mostrar()">Mostrar</button>
    
    <div id="caja">

    </div>
    <script type="text/JavaScript">
        
        let mostrar = false; // variable para controlar visibilidad

        function Mostrar() {
            

            if (!mostrar) {
                document.getElementById("caja").innerHTML = "<img src='../assets/img/Jotchua.webp' alt='perros'>";
                mostrar = true;
            } else {
                document.getElementById("caja").innerHTML = ""; 
                mostrar = false;
            }
        }

        

    </script>
</body>
</html>
