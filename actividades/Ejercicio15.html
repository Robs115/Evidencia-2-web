<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fondo Animado</title>
    <link rel="stylesheet" href="../assets/css/fondostyle.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <main style="text-align: center;">
        <h1><b>Fondo animado</b></h1>

        <div class="selector" style="margin-top: 20px;">
            <label for="elegircolor" style="margin-right: 10px;">Elige un color:</label>
            <input type="color" id="elegircolor" value="#00bcd4">
        </div>

        <div style="margin-top: 40px;">
            <a href="../index.html" class="btn btn-dark">Regresar a la Pagina Principal</a>
        </div>
    </main>

    <script>
        const elegircolor = document.getElementById("elegircolor");

        elegircolor.addEventListener("input", function() {
            const color = this.value;
            document.body.style.background = `linear-gradient(270deg, ${color}, #3f51b5, #9c27b0)`;
            document.body.style.backgroundSize = "600% 600%";
            document.body.style.animation = "Fondo 4s ease infinite";
        });
    </script>
</body>
</html>
